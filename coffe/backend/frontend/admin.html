<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card-facturacion { border: 1px solid #e1e4e8; padding: 15px; border-radius: 6px; margin-top: 15px; background: #fafbfc; }
        .card-facturacion h3 { margin-top: 0; color: #333; font-size: 1.1rem; border-bottom: 1px solid #eaecef; padding-bottom: 8px; }
        .card-facturacion p { margin: 8px 0; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h2>Detalle de Pedido y Facturación</h2>
    
    <div class="card-facturacion">
        <h3>Información de Facturación y Envío</h3>
        <p><strong>No. Factura:</strong> <span id="det-factura-numero">Pendiente</span></p>
        <p><strong>Dirección:</strong> <span id="det-factura-direccion">No especificada</span></p>
        <p><strong>Nombre:</strong> <span id="det-factura-nombre">C/F</span></p>
        <p><strong>NIT:</strong> <span id="det-factura-nit">C/F</span></p>
    </div>
</div>

<script>
function verDetallePedidoYPago(pedido, pago) {
    pago = pago || {};
    pedido = pedido || {};

    // Datos principales de la factura y cliente
    document.getElementById('det-factura-nombre').innerText = pago.invoice_name || pedido.invoice_name || pedido.customer || 'C/F';
    document.getElementById('det-factura-nit').innerText = pago.invoice_nit || pago.nit || pedido.invoice_nit || 'C/F';
    document.getElementById('det-factura-numero').innerText = pago.invoice_number || pedido.invoice_number || 'Pendiente';

    // Búsqueda robusta de la dirección priorizando los datos del pedido y respaldos en pago
    const direccionFacturaEncontrada = pedido.address || pedido.invoice_address || pago.invoice_address || pago.billing_address || pago.direccion_factura;
    
    document.getElementById('det-factura-direccion').innerText = (direccionFacturaEncontrada && direccionFacturaEncontrada.trim() !== '') 
        ? direccionFacturaEncontrada 
        : 'No especificada';
}

// Ejemplo de prueba ejecutando la función (puedes borrar esto al integrarlo con tus datos reales)
// verDetallePedidoYPago({ customer: "Juan Pérez", address: "1a Calle 2-3 Zona 1" }, { invoice_number: "F-001" });
</script>

</body>
</html>
