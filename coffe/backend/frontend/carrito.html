<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online - Carrito y Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">🛍️ Mi Tienda Full Stack</h1>
            <a href="index.html" class="text-indigo-600 font-medium hover:underline">← Volver al Catálogo</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <h2 class="text-3xl font-extrabold text-gray-900 mb-6">Tu Carrito de Compras</h2>

        <div class="bg-white shadow rounded-lg p-6 mb-6">
            <div id="cart-items" class="divide-y divide-gray-200"></div>
            <div class="mt-6 flex justify-between items-center border-t pt-4">
                <span class="text-xl font-bold text-gray-800">Total: $<span id="cart-total">0.00</span></span>
            </div>
        </div>

        <div class="bg-white shadow rounded-lg p-6">
            <h3 class="text-xl font-bold text-gray-800 mb-4">Finalizar Compra</h3>
            <form id="checkout-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nombre Completo</label>
                    <input type="text" id="customer-name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">
                    Completar Pedido
                </button>
            </form>
            <div id="order-message" class="mt-4 text-center font-medium"></div>
        </div>

        <div class="mt-8 bg-gray-900 text-white p-4 rounded-lg shadow">
            <h4 class="font-bold text-sm uppercase tracking-wider text-indigo-400 mb-2">📡 Actividad en Tiempo Real (WebSocket)</h4>
            <div id="ws-log" class="text-sm text-gray-300 space-y-1">Esperando eventos de pedidos...</div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        renderCart();
        setupCheckout();
        initWebSocket();
    </script>
</body>
</html>
