<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don Nicolás | Café Tradicional Colonial</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-colonial: #f4efe6;
            --primary-dark: #2c1d11;
            --accent-gold: #b38b4d;
            --text-main: #3b2f2f;
            --text-muted: #736257;
        }

        body {
            font-family: 'Lora', serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-colonial);
            color: var(--text-main);
        }

        header {
            text-align: center;
            padding: 3rem 1rem;
            background-color: var(--primary-dark);
            color: var(--bg-colonial);
            border-bottom: 3px solid var(--accent-gold);
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            margin: 0;
            letter-spacing: 3px;
            color: #faf6ef;
        }

        header p {
            font-size: 0.9rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--accent-gold);
            margin-top: 0.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .catalogo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .producto-card {
            background: #faf6ef;
            border: 1px solid #e3dbcc;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(44,29,17,0.03);
            transition: transform 0.3s ease;
        }

        .producto-card:hover {
            transform: translateY(-5px);
        }

        .producto-img-box {
            width: 100%;
            height: 200px;
            background: #fff;
            border: 1px solid #e3dbcc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 1rem;
            cursor: pointer;
        }

        .producto-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .producto-card h3 {
            font-family: 'Cinzel', serif;
            color: var(--primary-dark);
            font-size: 1.2rem;
            margin: 0.5rem 0;
        }

        .producto-card .categoria {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-gold);
        }

        .producto-card .precio {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: var(--primary-dark);
            margin: 1rem 0;
            font-weight: bold;
        }

        .btn-comprar {
            background: var(--primary-dark);
            color: var(--bg-colonial);
            border: none;
            padding: 10px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-comprar:hover {
            background: var(--accent-gold);
            color: var(--primary-dark);
        }

        /* MODAL DE DETALLE / COMPRA */
        #modal-detalle {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(26, 18, 11, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
            box-sizing: border-box;
        }

        .modal-card {
            background: #faf6ef;
            border: 2px solid var(--accent-gold);
            width: 100%;
            max-width: 800px;
            padding: 2.5rem;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            box-sizing: border-box;
        }

        .modal-cerrar {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--primary-dark);
            font-family: 'Cinzel', serif;
        }

        .modal-img-grande {
            width: 100%;
            height: 320px;
            background: #fff;
            border: 1px solid #e3dbcc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .modal-img-grande img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-info h2 {
            font-family: 'Cinzel', serif;
            color: var(--primary-dark);
            margin-top: 0;
            font-size: 1.6rem;
        }

        .modal-info .cat {
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-gold);
            display: block;
            margin-bottom: 0.5rem;
        }

        .modal-info .precio {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: var(--primary-dark);
            margin-bottom: 1rem;
        }

        /* CONTENEDOR DE ICONOS / ESPECIFICACIONES REDONDAS */
        .specs-preview-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 1rem 0;
        }

        .spec-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f2ebd9;
            border: 1px solid #e3dbcc;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--primary-dark);
        }

        .spec-badge img {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
        }

        .molienda-grupo {
            margin: 1rem 0;
        }

        .molienda-grupo label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Cinzel', serif;
            display: block;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
        }

        .molienda-opciones {
            display: flex;
            gap: 8px;
        }

        .btn-molienda {
            background: #fff;
            border: 1px solid #e3dbcc;
            padding: 6px 12px;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--primary-dark);
        }

        .btn-molienda.activo {
            background: var(--primary-dark);
            color: #faf6ef;
            border-color: var(--primary-dark);
        }

        .cantidad-grupo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 1.5rem 0;
        }

        .cantidad-grupo button {
            background: #e3dbcc;
            border: none;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-weight: bold;
        }

        .cantidad-grupo input {
            width: 40px;
            text-align: center;
            border: 1px solid #e3dbcc;
            padding: 5px;
            font-family: 'Lora', serif;
        }

        @media (max-width: 768px) {
            .modal-card {
                grid-template-columns: 1fr;
                max-height: 90vh;
                overflow-y: auto;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Don Nicolás</h1>
        <p>Tradición que se saborea</p>
    </header>

    <div class="container">
        <div id="catalogo-productos" class="catalogo-grid">
            <!-- Los productos se cargan dinámicamente aquí -->
        </div>
    </div>

    <!-- MODAL DE DETALLE -->
    <div id="modal-detalle">
        <div class="modal-card">
            <button class="modal-cerrar" onclick="cerrarModal()">×</button>
            <div>
                <div class="modal-img-grande">
                    <img id="modal-img" src="" alt="Producto">
                </div>
            </div>
            <div class="modal-info">
                <span id="modal-cat" class="cat">Categoría</span>
                <h2 id="modal-nombre">Nombre del Producto</h2>
                <div id="modal-precio" class="precio">Q0.00</div>
                
                <!-- ICONOS / ESPECIFICACIONES -->
                <div id="modal-specs" class="specs-preview-grid"></div>

                <p id="modal-desc" style="font-size: 0.9rem; color: var(--text-muted);"></p>

                <!-- SELECTOR DE MOLIENDA DINÁMICO -->
                <div id="modal-molienda-container" class="molienda-grupo">
                    <label>Selecciona tu molienda</label>
                    <div class="molienda-opciones">
                        <button type="button" class="btn-molienda activo" onclick="seleccionarMolienda(this, 'Grano')">Grano</button>
                        <button type="button" class="btn-molienda" onclick="seleccionarMolienda(this, 'Fina')">Fina</button>
                        <button type="button" class="btn-molienda" onclick="seleccionarMolienda(this, 'Media')">Media</button>
                        <button type="button" class="btn-molienda" onclick="seleccionarMolienda(this, 'Gruesa')">Gruesa</button>
                    </div>
                </div>

                <div class="cantidad-grupo">
                    <label style="font-size: 0.75rem; font-family: 'Cinzel', serif; text-transform: uppercase;">Cantidad</label>
                    <button onclick="cambiarCantidad(-1)">-</button>
                    <input type="text" id="modal-cantidad" value="1" readonly>
                    <button onclick="cambiarCantidad(1)">+</button>
                </div>

                <button class="btn-comprar" style="width: 100%;" onclick="agregarAlCarritoModal()">Añadir al Carrito</button>
            </div>
        </div>
    </div>

    <script>
        let productoSeleccionado = null;
        let moliendaSeleccionada = 'Grano';

        async function cargarCatalogoTienda() {
            try {
                const res = await fetch('/api/admin/products'); // O la ruta pública de tu API de productos
                const productos = await res.json();
                const grid = document.getElementById('catalogo-productos');
                grid.innerHTML = '';

                if (productos.length === 0) {
                    grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No hay productos disponibles por el momento.</p>`;
                    return;
                }

                productos.forEach(p => {
                    const imgUrl = p.image_url || 'https://via.placeholder.com/300?text=Don+Nicolas';
                    grid.innerHTML += `
                        <div class="producto-card">
                            <div>
                                <div class="producto-img-box" onclick='abrirModal(${JSON.stringify(p)})'>
                                    <img src="${imgUrl}" alt="${p.name}">
                                </div>
                                <span class="categoria">${p.category || 'Café'}</span>
                                <h3>${p.name}</h3>
                                <div class="precio">Q${Number(p.price).toFixed(2)}</div>
                            </div>
                            <button class="btn-comprar" onclick='abrirModal(${JSON.stringify(p)})'>Ver Opciones</button>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Error cargando productos:", err);
            }
        }

        function abrirModal(p) {
            productoSeleccionado = p;
            document.getElementById('modal-nombre').innerText = p.name;
            document.getElementById('modal-cat').innerText = p.category || 'Café';
            document.getElementById('modal-precio').innerText = `Q${Number(p.price).toFixed(2)}`;
            document.getElementById('modal-desc').innerText = p.description || 'Sin descripción disponible.';
            document.getElementById('modal-img').src = p.image_url || 'https://via.placeholder.com/300?text=Don+Nicolas';
            document.getElementById('modal-cantidad').value = 1;

            // Renderizar especificaciones / iconos redondos en el modal
            const specsContainer = document.getElementById('modal-specs');
            specsContainer.innerHTML = '';
            if (p.specs) {
                let specsArray = [];
                try {
                    specsArray = typeof p.specs === 'string' ? JSON.parse(p.specs) : p.specs;
                } catch(e) { specsArray = []; }

                if (Array.isArray(specsArray) && specsArray.length > 0) {
                    specsArray.forEach(spec => {
                        specsContainer.innerHTML += `
                            <div class="spec-badge">
                                ${spec.icon_url ? `<img src="${spec.icon_url}" alt="Icono">` : ''}
                                <span>${spec.label}</span>
                            </div>
                        `;
                    });
                }
            }

            // Gestionar visibilidad del selector de molienda según el producto (has_grind)
            const moliendaContainer = document.getElementById('modal-molienda-container');
            if (p.has_grind === 'no') {
                moliendaContainer.style.display = 'none';
            } else {
                moliendaContainer.style.display = 'block';
            }

            document.getElementById('modal-detalle').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modal-detalle').style.display = 'none';
        }

        function seleccionarMolienda(btn, tipo) {
            document.querySelectorAll('.btn-molienda').forEach(b => b.classList.remove('activo'));
            btn.classList.add('activo');
            moliendaSeleccionada = tipo;
        }

        function cambiarCantidad(delta) {
            const input = document.getElementById('modal-cantidad');
            let val = parseInt(input.value) + delta;
            if (val < 1) val = 1;
            input.value = val;
        }

        function agregarAlCarritoModal() {
            if (!productoSeleccionado) return;
            const cantidad = parseInt(document.getElementById('modal-cantidad').value);
            
            // Lógica de tu carrito de compras frontend
            console.log("Añadido al carrito:", {
                producto: productoSeleccionado.name,
                precio: productoSeleccionado.price,
                cantidad: cantidad,
                molienda: productoSeleccionado.has_grind !== 'no' ? moliendaSeleccionada : 'N/A'
            });

            alert(`¡${productoSeleccionado.name} agregado al carrito con éxito!`);
            cerrarModal();
        }

        // Cargar al iniciar
        window.onload = () => {
            cargarCatalogoTienda();
        };
    </script>
</body>
</html>
